name: "Rebuild Data"
on:
  schedule:
    - cron: "33 17 * * 4" # Thursdays 17:33 UTC (12:33pm ET), the day after the hub refreshes
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - predtimechart-config.yml
      - predevals-config.yml
  workflow_dispatch:
    inputs:
      regenerate:
        description: "(Forecast) Regenerate previously-recorded model output data?"
        type: boolean
        required: false
        default: true
      data:
        description: "(Forecast) Which forecast page data should be built?"
        type: choice
        options:
          - 'target'
          - 'forecast'
          - 'both'
        required: false
        default: 'both'
      publish:
        description: "Push Data to branch (uncheck for a dry run)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  site:
    uses: hubverse-org/hub-dashboard-control-room/.github/workflows/generate-data.yaml@main
    with:
      owner: '${{ github.event.repository.owner.login }}'
      name: '${{ github.event.repository.name }}'
      slug: '${{ github.event.repository.owner.login }}'
      email: '${{ github.event.repository.owner.id }}+${{ github.event.repository.owner.login }}@users.noreply.github.com'
      regenerate: ${{ github.event_name != 'workflow_dispatch' || inputs.regenerate }}
      build: ${{ inputs.data || 'both' }}
      publish: ${{ inputs.publish || github.event_name == 'schedule' || github.event_name == 'push' }}
    secrets:
      id: 'none'
      key: ${{ secrets.GITHUB_TOKEN }}

  # Added: post-process the generated predtimechart-options.json and targets/.
  #   1. Trim the Location dropdown to locations that actually have forecasts.
  #   2. Snap initial_as_of to a date the opening target actually has,
  #      preventing "initial_as_of not in available_as_ofs" load failures
  #      when targets have uneven submission coverage.
  #   3. Extend truth files to the hub's latest data snapshot and point
  #      current_date at it, so the "Current" line tracks the actual current
  #      week of data even when forecast submissions pause (off-season).
  # Runs after the reusable data build has pushed the ptc/data branch.
  prune-locations:
    name: "Post-process predtimechart options"
    needs: site
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.publish == null || inputs.publish)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (for the post-processing scripts)
        uses: actions/checkout@v4
      - name: Checkout ptc/data
        uses: actions/checkout@v4
        with:
          ref: ptc/data
          path: ptc-data
      - name: Checkout hub (for versioned target data)
        uses: actions/checkout@v4
        with:
          repository: DMA-PRIME/DMA-PRIME-Model-Challenge-Sandbox
          path: hub
      - name: Install dependencies
        run: pip install polars
      - name: Prune locations without forecasts
        run: python3 scripts/prune_ptc_locations.py ptc-data
      - name: Fix initial as_of for uneven target coverage
        run: python3 scripts/fix_ptc_initial_as_of.py ptc-data
      - name: Extend truth to latest data week
        run: python3 scripts/extend_ptc_targets.py hub ptc-data
      - name: Commit if changed
        run: |
          cd ptc-data
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to post-process."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predtimechart-options.json targets/
          git commit -m "Post-process ptc data (prune, fix initial_as_of, extend truth to latest week)"
          git push
